name: Beta release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build and publish Windows beta
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@10.33.0

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag and package versions
        shell: pwsh
        run: |
          $expected = $env:GITHUB_REF_NAME.TrimStart('v')
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"$').Matches[0].Groups[1].Value
          if ($packageVersion -ne $expected -or $tauriVersion -ne $expected -or $cargoVersion -ne $expected) {
            throw "Tag $expected does not match package ($packageVersion), Tauri ($tauriVersion), and Cargo ($cargoVersion) versions."
          }

      - name: Run frontend checks
        run: |
          pnpm lint
          pnpm test

      - name: Run Rust checks
        working-directory: src-tauri
        run: |
          cargo fmt --all -- --check
          cargo test --locked
          cargo check --locked

      - name: Build NSIS installer
        run: pnpm desktop:build

      - name: Smoke-test installer, app launch, and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced." }

          $installDir = Join-Path $env:RUNNER_TEMP "cc-router-smoke"
          $installedApp = $null
          $uninstaller = $null
          $launchedApp = $null

          try {
            $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "Silent install failed with exit code $($install.ExitCode)." }

            $uninstaller = Get-ChildItem $installDir -Filter "*.exe" -Recurse |
              Where-Object { $_.Name -match '^(unins|uninstall)' } |
              Select-Object -First 1
            $installedApp = Get-ChildItem $installDir -Filter "*.exe" -Recurse |
              Where-Object { $_.Name -notmatch '^(unins|uninstall)' } |
              Select-Object -First 1
            if (-not $installedApp) { throw "Installed application executable was not found." }
            if (-not $uninstaller) { throw "NSIS uninstaller was not found." }

            $launchedApp = Start-Process -FilePath $installedApp.FullName -WindowStyle Hidden -PassThru
            Start-Sleep -Seconds 5
            $launchedApp.Refresh()
            if ($launchedApp.HasExited) { throw "Installed app exited during the launch smoke test." }
            Stop-Process -Id $launchedApp.Id -Force
            Wait-Process -Id $launchedApp.Id -ErrorAction SilentlyContinue
            $launchedApp = $null

            $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw "Silent uninstall failed with exit code $($uninstall.ExitCode)." }
            $uninstaller = $null

            for ($attempt = 0; $attempt -lt 20 -and (Test-Path $installedApp.FullName); $attempt++) {
              Start-Sleep -Milliseconds 500
            }
            if (Test-Path $installedApp.FullName) { throw "Application executable remains after uninstall." }
          }
          finally {
            if ($launchedApp -and -not $launchedApp.HasExited) {
              Stop-Process -Id $launchedApp.Id -Force -ErrorAction SilentlyContinue
            }
            if ($uninstaller -and (Test-Path $uninstaller.FullName)) {
              Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait | Out-Null
            }
          }

      - name: Generate checksum
        id: package
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced." }
          $checksumPath = "$($installer.FullName).sha256"
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -LiteralPath $checksumPath -Encoding ascii
          "installer=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "checksum=$checksumPath" >> $env:GITHUB_OUTPUT

      - name: Attest installer provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.installer }}

      - name: Publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_PATH: ${{ steps.package.outputs.installer }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksum }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            $env:INSTALLER_PATH `
            $env:CHECKSUM_PATH `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --prerelease `
            --generate-notes `
            --title $env:GITHUB_REF_NAME
